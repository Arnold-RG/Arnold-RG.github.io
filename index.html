<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a07" />
    <meta
      name="description"
      content="Hamwe Tourism plans full Rwanda tours for small groups of strangers. Buy a ticket, meet the table, walk the thousand hills together."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Syne:ital,wght@0,700;0,800;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <title>Hamwe Tourism</title>
    <meta property="og:title" content="Hamwe Tourism" />
    <meta property="og:description" content="Hosted Rwanda tours from Kigali. Hamwe Tourism." />
    <style>
      #boot-intro {
        position: fixed;
        inset: 0;
        z-index: 400;
        background: #050a07;
        display: grid;
        place-items: center;
      }
      #boot-intro img {
        width: min(78vw, 420px);
        height: auto;
        animation: boot-logo 1.8s ease-in-out infinite;
      }
      @keyframes boot-logo {
        0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 24px rgba(226, 178, 58, 0.35)); }
        50% { transform: scale(1.04); opacity: 0.88; filter: drop-shadow(0 0 40px rgba(226, 178, 58, 0.55)); }
      }
    </style>
  </head>
  <body>
    <div id="boot-intro" aria-hidden="true">
      <img src="/brand/hamwe-logo-lockup.png" alt="Hamwe Tourism" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
